services:
  # O SERVIÇO WEB (PYTHON)
  - type: web
    name: MoneyLayer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    region: oregon
    
    # Conecta automaticamente ao banco de dados
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moneyleyerpostgres
          property: connectionString
      
      # SEGURANÇA: sync: false avisa o Render para usar as chaves do painel seguro
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false

databases:
  # O BANCO DE DADOS
  - name: moneyleyerpostgres
    plan: free
    region: oregon
    ipAllowList: [] # Bloqueia acesso externo direto (Segurança máxima)
