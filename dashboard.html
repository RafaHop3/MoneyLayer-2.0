cat <<EOF > templates/dashboard.html
<!DOCTYPE html>
<html>
<head>
    <title>MoneyLayer - Painel</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }

        .btn-pay { background: #6772e5; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; border: none; font-size: 16px; cursor: pointer; }

        .logout { color: red; text-decoration: none; font-weight: bold; }
        .admin-badge { background: #ffd700; color: black; padding: 5px 10px; border-radius: 10px; font-weight: bold; text-decoration: none; font-size: 12px; border: 1px solid #e6c200; }
    </style>
</head>
<body>
    <div class="header">

                <a href="/admin" class="admin-badge">👑 ADMIN</a>
            {% endif %}

        <a href="/logout" class="logout">Sair 🚪</a>

        <h2>Fundo Social</h2>

        </form>
