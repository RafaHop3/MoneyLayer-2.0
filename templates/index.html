<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyLayer Enterprise</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        .badge-social { background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:4px; font-weight:bold; font-size: 0.8em; }
        .badge-entrada { background:#e3f2fd; color:#1565c0; padding:2px 8px; border-radius:4px; font-size: 0.8em; }
        .cta-box { background: #f0f0f0; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <main class="container">
        <nav><ul><li><strong>MoneyLayer 2.0</strong></li></ul></nav>
        
        <div class="grid">
            <article>
                <header>Fundo Social</header>
                <h1 style="margin-bottom:0">{{ saldo_formatado }}</h1>
            </article>
            <article class="cta-box">
                <header>Faça a Economia Girar</header>
                <p>Simule uma venda real de R$ 10,00</p>
                <form action="/create-checkout-session" method="POST">
                    <button type="submit" role="button" class="contrast">💳 Pagar R$ 10,00</button>
                </form>
            </article>
        </div>
        
        <h3>📊 Auditoria (Últimas 10 Transações)</h3>
        <figure>
            <table role="grid">
                <thead><tr><th>Data</th><th>Tipo</th><th>Valor</th><th>Detalhes</th></tr></thead>
                <tbody>
                    {% for item in extrato %}
                    <tr>
                        <td>{{ item[0].strftime('%d/%m %H:%M') }}</td>
                        <td>
                            {% if item[1] == 'ENTRADA' %}<span class="badge-entrada">RECEITA</span>
                            {% else %}<span class="badge-social">SOCIAL ❤️</span>{% endif %}
                        </td>
                        <td>R$ {{ "%.2f"|format(item[2]) }}</td>
                        <td>{{ item[3] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </figure>
    </main>
</body>
</html>
